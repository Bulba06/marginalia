# Continuous integration pipeline of Marginália.
# It builds the software and then runs the SAST, the tests and the DAST.
name: CI

on:
  push:
    branches: ["develop", "feature/**"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build the software and the unit tests
        run: make

  sast:
    name: SAST
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Install Semgrep
        run: pipx install semgrep==1.182.1
      - name: Run the static analysis
        run: make sast

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Run the tests under the sanitizers
        run: make sanitizers
      - name: Run the tests under Valgrind
        run: make valgrind

  dast:
    name: DAST
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Run the dynamic analysis
        run: make dast
